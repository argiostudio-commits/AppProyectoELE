<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Presupuestos de Obra</title>
<style>
/* =====================================================================
   1. VARIABLES DE PERSONALIZACIÓN VISUAL
   Para cambiar los colores de la aplicación, modificá los valores acá.
   ===================================================================== */
:root{
  --bg:#EEEBE4;            /* fondo general (color plaster/revoque) */
  --surface:#FFFFFF;        /* fondo de tarjetas y paneles */
  --surface-2:#F6F3EE;      /* fondo levemente distinto (filas alternadas) */
  --ink:#2A2724;            /* texto principal */
  --ink-soft:#6B655D;       /* texto secundario */
  --line:#DCD5C9;           /* líneas y bordes finos */
  --brick:#A8432E;          /* color principal (ladrillo) */
  --brick-dark:#7C3020;     /* color principal, variante oscura (hover) */
  --brick-tint:#F3E1DA;     /* fondo suave con el color principal */
  --success:#3F7A4E;
  --success-tint:#E3EFE4;
  --danger:#B23A2A;
  --danger-tint:#F5E2DE;
  --radius:12px;
  --radius-sm:8px;
  --shadow-modal:0 12px 32px rgba(30,25,20,0.28);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  font-size:16px;
  line-height:1.45;
}
button, input, select, textarea{ font-family:inherit; font-size:16px; color:inherit; }
h1,h2,h3,h4{ margin:0; font-weight:700; }
p{ margin:0; }
button{ cursor:pointer; }
::selection{ background:var(--brick-tint); }

/* Foco visible para accesibilidad / teclado */
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
  outline:3px solid var(--brick);
  outline-offset:2px;
}

.oculto{ display:none !important; }

/* =====================================================================
   2. ESTRUCTURA GENERAL
   ===================================================================== */
#app{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:10px;
  min-height:60px;
}
.topbar .marca{
  display:flex;
  align-items:center;
  gap:10px;
  flex:1;
}
.topbar .marca-logo{
  width:34px; height:34px; border-radius:8px; object-fit:cover; flex-shrink:0;
  background:var(--brick-tint);
}
.topbar h1{ font-size:19px; }
.topbar .subt{ font-size:12.5px; color:var(--ink-soft); margin-top:1px; }
.btn-volver{
  width:40px; height:40px; border-radius:50%;
  border:none; background:transparent; display:flex; align-items:center; justify-content:center;
  color:var(--ink); flex-shrink:0;
}
.btn-volver:active{ background:var(--surface-2); }

.main-content{
  flex:1;
  width:100%;
  max-width:760px;
  margin:0 auto;
  padding:16px 16px 96px 16px;
}

/* Barra de navegación inferior (celular) */
.bottom-nav{
  position:fixed; bottom:0; left:0; right:0; z-index:30;
  background:var(--surface);
  border-top:1px solid var(--line);
  display:flex;
  padding-bottom:env(safe-area-inset-bottom);
}
.bottom-nav button{
  flex:1; border:none; background:none; padding:9px 4px 8px;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  color:var(--ink-soft); font-size:12.5px; font-weight:600;
}
.bottom-nav button.activo{ color:var(--brick); }
.bottom-nav svg{ width:23px; height:23px; }

@media (min-width:780px){
  #app{ flex-direction:row; }
  .topbar{ display:none; }
  .bottom-nav{
    position:sticky; top:0; height:100vh;
    flex-direction:column; width:230px; flex-shrink:0;
    border-top:none; border-right:1px solid var(--line);
    padding:22px 12px;
    justify-content:flex-start; gap:6px;
  }
  .bottom-nav .marca-desktop{
    display:flex; align-items:center; gap:10px; padding:0 10px 20px;
  }
  .bottom-nav .marca-desktop img{ width:36px;height:36px;border-radius:9px;object-fit:cover; }
  .bottom-nav .marca-desktop b{ font-size:16px; }
  .bottom-nav button{
    flex-direction:row; justify-content:flex-start; gap:12px;
    padding:12px 14px; border-radius:var(--radius-sm); font-size:15px;
  }
  .bottom-nav button.activo{ background:var(--brick-tint); }
  .main-content{ max-width:880px; padding:32px 40px 60px; }
}

/* =====================================================================
   3. BOTONES
   ===================================================================== */
.btn{
  min-height:50px;
  padding:12px 20px;
  border-radius:var(--radius-sm);
  border:1px solid transparent;
  font-weight:700;
  font-size:16px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:background .12s ease;
}
.btn-bloque{ width:100%; }
.btn svg{ width:20px; height:20px; flex-shrink:0; }
.btn-primario{ background:var(--brick); color:#fff; }
.btn-primario:active, .btn-primario:hover{ background:var(--brick-dark); }
.btn-secundario{ background:var(--surface); color:var(--ink); border-color:var(--line); }
.btn-secundario:hover{ background:var(--surface-2); }
.btn-fantasma{ background:transparent; color:var(--brick); border-color:transparent; padding:10px 12px; min-height:auto; }
.btn-peligro{ background:var(--danger-tint); color:var(--danger); }
.btn-peligro-lleno{ background:var(--danger); color:#fff; }
.btn-chico{ min-height:40px; padding:8px 14px; font-size:14.5px; }
.btn-icono{
  width:44px; height:44px; padding:0; border-radius:50%;
  background:var(--surface-2); color:var(--ink); border:none;
}
.btn-icono:hover{ background:var(--line); }
.btn:disabled{ opacity:.5; cursor:not-allowed; }

.fab{
  position:fixed; right:18px; bottom:86px; z-index:15;
  width:60px; height:60px; border-radius:50%;
  background:var(--brick); color:#fff; border:none;
  box-shadow:0 6px 18px rgba(124,48,32,.4);
  display:flex; align-items:center; justify-content:center;
}
.fab svg{ width:28px; height:28px; }
@media (min-width:780px){ .fab{ display:none; } }

/* =====================================================================
   4. TARJETAS Y LISTAS
   ===================================================================== */
.tarjeta{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
}
.tarjeta + .tarjeta{ margin-top:10px; }

.tarjeta-presupuesto{
  display:flex; align-items:center; gap:12px; width:100%;
  text-align:left; border:1px solid var(--line); background:var(--surface);
  border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;
}
.tarjeta-presupuesto .datos{ flex:1; min-width:0; }
.tarjeta-presupuesto .cliente{ font-size:16.5px; font-weight:700; }
.tarjeta-presupuesto .fecha{ font-size:13.5px; color:var(--ink-soft); margin-top:2px; }
.tarjeta-presupuesto .total{ font-size:17px; font-weight:700; color:var(--brick); white-space:nowrap; }
.tarjeta-presupuesto svg.chevron{ width:20px; height:20px; color:var(--ink-soft); flex-shrink:0; }

.encabezado-seccion{
  display:flex; align-items:center; justify-content:space-between;
  margin:26px 0 12px;
}
.encabezado-seccion:first-child{ margin-top:0; }
.encabezado-seccion h2{ font-size:20px; }

.vacio{
  text-align:center; padding:40px 18px; color:var(--ink-soft);
}
.vacio svg{ width:52px;height:52px; color:var(--line); margin-bottom:10px; }

/* =====================================================================
   5. FORMULARIOS
   ===================================================================== */
.campo{ margin-bottom:16px; }
.campo label{
  display:block; font-size:14px; font-weight:700; color:var(--ink-soft);
  margin-bottom:6px;
}
.campo input[type=text], .campo input[type=tel], .campo input[type=number],
.campo input[type=date], .campo select, .campo textarea{
  width:100%; min-height:50px; padding:10px 13px;
  border:1.5px solid var(--line); border-radius:var(--radius-sm);
  background:var(--surface); color:var(--ink);
}
.campo textarea{ min-height:90px; resize:vertical; padding-top:12px; }
.campo input:focus, .campo select:focus, .campo textarea:focus{ border-color:var(--brick); }
.campo .ayuda{ font-size:12.5px; color:var(--ink-soft); margin-top:5px; }
.fila-2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width:480px){ .fila-2.apilar-movil{ grid-template-columns:1fr; } }

.switch-fila{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:13px 0;
}
.switch-fila .texto b{ display:block; font-size:15.5px; }
.switch-fila .texto span{ font-size:13px; color:var(--ink-soft); }
.switch{ position:relative; width:48px; height:28px; flex-shrink:0; }
.switch input{ opacity:0; width:100%; height:100%; margin:0; position:absolute; z-index:2; cursor:pointer; }
.switch .rail{
  position:absolute; inset:0; background:var(--line); border-radius:99px; transition:background .15s;
}
.switch .bola{
  position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%;
  background:#fff; transition:transform .15s; box-shadow:0 1px 3px rgba(0,0,0,.3);
}
.switch input:checked ~ .rail{ background:var(--brick); }
.switch input:checked ~ .bola{ transform:translateX(20px); }

/* =====================================================================
   6. TRABAJOS DENTRO DEL PRESUPUESTO
   ===================================================================== */
.trabajo-item{
  border:1px solid var(--line); border-radius:var(--radius); padding:13px 14px;
  margin-bottom:9px; background:var(--surface);
}
.trabajo-item .top{ display:flex; justify-content:space-between; gap:10px; }
.trabajo-item .tipo{ font-size:12.5px; font-weight:700; color:var(--brick); text-transform:none; }
.trabajo-item .desc{ font-size:15.5px; font-weight:600; margin-top:2px; }
.trabajo-item .calc{ font-size:14px; color:var(--ink-soft); margin-top:7px; }
.trabajo-item .subtotal{ font-size:16.5px; font-weight:700; margin-top:2px; }
.trabajo-item .acciones{ display:flex; gap:4px; flex-shrink:0; }
.trabajo-item .acciones button{
  width:36px; height:36px; border-radius:50%; border:none; background:var(--surface-2); color:var(--ink-soft);
}

.tabla-trabajos{ display:none; }
@media (min-width:780px){
  .lista-trabajos-movil{ display:none; }
  .tabla-trabajos{
    display:table; width:100%; border-collapse:collapse; margin-bottom:14px;
  }
  .tabla-trabajos th{
    text-align:left; font-size:12.5px; color:var(--ink-soft); font-weight:700;
    padding:8px 10px; border-bottom:1.5px solid var(--line);
  }
  .tabla-trabajos td{ padding:10px; border-bottom:1px solid var(--line); font-size:14.5px; vertical-align:middle; }
  .tabla-trabajos tr:hover td{ background:var(--surface-2); }
  .tabla-trabajos td.num{ text-align:right; white-space:nowrap; }
  .tabla-trabajos .acciones-tabla{ display:flex; gap:4px; justify-content:flex-end; }
  .tabla-trabajos .acciones-tabla button{
    width:32px; height:32px; border-radius:50%; border:none; background:var(--surface-2); color:var(--ink-soft);
  }
}

.ambiente-bloque{ margin-bottom:18px; }
.ambiente-cabecera{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  margin-bottom:8px;
}
.ambiente-cabecera h3{ font-size:16.5px; }
.ambiente-subtotal{
  display:flex; justify-content:flex-end; padding:8px 4px; font-size:15px; font-weight:700;
  color:var(--ink-soft);
}

/* =====================================================================
   7. RESUMEN Y TOTALES
   ===================================================================== */
.resumen{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px; margin-top:6px;
}
.resumen .linea{
  display:flex; justify-content:space-between; padding:7px 0; font-size:15.5px; color:var(--ink-soft);
}
.resumen .linea b{ color:var(--ink); font-weight:600; }
.resumen .linea-total{
  display:flex; justify-content:space-between; align-items:center;
  padding-top:14px; margin-top:6px; border-top:2px solid var(--line);
}
.resumen .linea-total span{ font-size:17px; font-weight:700; }
.resumen .linea-total b{ font-size:29px; color:var(--brick); font-weight:800; }

/* =====================================================================
   8. MODALES
   ===================================================================== */
.overlay{
  position:fixed; inset:0; background:rgba(20,17,14,.5); z-index:100;
  display:flex; align-items:flex-end; justify-content:center;
}
.modal{
  background:var(--surface); width:100%; max-width:480px;
  border-radius:20px 20px 0 0; padding:22px 20px calc(20px + env(safe-area-inset-bottom));
  box-shadow:var(--shadow-modal);
  max-height:88vh; overflow-y:auto;
}
.modal h3{ font-size:19px; margin-bottom:8px; }
.modal p{ color:var(--ink-soft); font-size:15px; margin-bottom:18px; }
.modal .modal-botones{ display:flex; gap:10px; margin-top:6px; }
.modal .modal-botones .btn{ flex:1; }
@media (min-width:780px){
  .overlay{ align-items:center; }
  .modal{ border-radius:16px; max-height:85vh; }
}

.toast{
  position:fixed; left:50%; bottom:96px; transform:translateX(-50%);
  background:var(--ink); color:#fff; padding:12px 20px; border-radius:99px;
  font-size:14.5px; font-weight:600; z-index:200; box-shadow:0 8px 20px rgba(0,0,0,.3);
  display:flex; align-items:center; gap:8px;
}
@media (min-width:780px){ .toast{ bottom:26px; } }

/* =====================================================================
   9. CATÁLOGO DE PRECIOS
   ===================================================================== */
.precio-item{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  border:1px solid var(--line); border-radius:var(--radius); padding:13px 14px; margin-bottom:9px;
  background:var(--surface);
}
.precio-item .info b{ display:block; font-size:15.5px; }
.precio-item .info span{ font-size:13px; color:var(--ink-soft); }
.precio-item .valor{ text-align:right; }
.precio-item .valor b{ display:block; font-size:16px; }
.precio-item .valor span{ font-size:12.5px; color:var(--ink-soft); }
.chip-categoria{
  display:inline-block; font-size:11.5px; font-weight:700; color:var(--brick);
  background:var(--brick-tint); padding:2px 8px; border-radius:99px; margin-top:4px;
}

/* Buscador */
.buscador{ position:relative; margin-bottom:14px; }
.buscador svg{ position:absolute; left:14px; top:50%; transform:translateY(-50%); width:19px; height:19px; color:var(--ink-soft); }
.buscador input{ width:100%; min-height:48px; padding:10px 14px 10px 40px; border:1.5px solid var(--line); border-radius:99px; background:var(--surface); }

/* =====================================================================
   10. CONFIGURACIÓN
   ===================================================================== */
.logo-selector{ display:flex; align-items:center; gap:14px; margin-bottom:6px; }
.logo-preview{
  width:66px; height:66px; border-radius:14px; background:var(--surface-2); border:1.5px dashed var(--line);
  display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0;
}
.logo-preview img{ width:100%; height:100%; object-fit:cover; }
.logo-preview svg{ width:26px; height:26px; color:var(--ink-soft); }

/* =====================================================================
   11. IMPRESIÓN / PDF
   ===================================================================== */
#print-area{ display:none; }
@media print{
  @page{ size:A4; margin:14mm; }
  body *{ visibility:hidden; }
  #print-area, #print-area *{ visibility:visible; }
  #print-area{
    display:block !important; position:absolute; top:0; left:0; width:100%; padding:0; margin:0;
    color:#111; font-size:13px;
  }
  .hoja{ width:100%; }
  .ph-header{ display:flex; align-items:center; gap:16px; border-bottom:3px solid #A8432E; padding-bottom:14px; margin-bottom:18px; }
  .ph-logo{ width:56px;height:56px;border-radius:10px;object-fit:cover; }
  .ph-empresa{ font-size:20px; font-weight:800; }
  .ph-contacto{ font-size:12.5px; color:#555; margin-top:2px; }
  .ph-titulo{ margin-left:auto; text-align:right; font-size:22px; font-weight:800; letter-spacing:.5px; color:#A8432E; }
  .ph-datos-cliente{ display:flex; justify-content:space-between; gap:20px; margin-bottom:16px; font-size:13px; }
  .ph-datos-cliente div b{ display:block; font-size:11px; color:#777; font-weight:700; margin-bottom:2px; }
  table.ph-tabla{ width:100%; border-collapse:collapse; margin-bottom:14px; }
  table.ph-tabla th{ text-align:left; font-size:11px; color:#666; border-bottom:2px solid #333; padding:6px 5px; }
  table.ph-tabla td{ font-size:12.5px; padding:6px 5px; border-bottom:1px solid #ddd; }
  table.ph-tabla td.num, table.ph-tabla th.num{ text-align:right; }
  .ph-ambiente-titulo{ font-weight:700; font-size:13px; margin:10px 0 4px; color:#A8432E; }
  .ph-resumen{ margin-left:auto; width:280px; margin-top:8px; }
  .ph-resumen .linea{ display:flex; justify-content:space-between; font-size:13px; padding:4px 0; }
  .ph-resumen .total{ display:flex; justify-content:space-between; font-size:18px; font-weight:800; border-top:2px solid #333; padding-top:8px; margin-top:6px; }
  .ph-nota{ font-size:12px; margin-top:6px; color:#333; }
  .ph-condiciones{ margin-top:22px; font-size:11.5px; color:#555; border-top:1px solid #ccc; padding-top:10px; white-space:pre-line; }
}
</style>
</head>
<body>

<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="print-area"></div>

<script>
(function(){
"use strict";

/* =====================================================================
   2. CONFIGURACIÓN INICIAL / DATOS POR DEFECTO
   Modificá acá los valores iniciales de la empresa, los trabajos
   habituales, los tipos de trabajo y el texto de condiciones.
   Estos valores sólo se usan la primera vez que se abre la app;
   después el usuario los edita desde "Configuración" y "Precios".
   ===================================================================== */
const CONFIG_INICIAL = {
  empresa: "Nombre del Albañil",
  telefono: "",
  localidad: "",
  logo: null, // se completa como imagen en base64 al subir un logo
  condicionesDefault:
"Presupuesto válido por 15 días.\nMateriales no incluidos, salvo indicación contraria.\nLos precios pueden variar ante modificaciones de la obra.\nSeña del 30% para reservar la fecha de inicio."
};

const TIPOS_TRABAJO_INICIALES = [
  "Albañilería","Aberturas","Revoque grueso","Revoque fino","Carpeta",
  "Piso cerámico","Contrapiso","Hormigón","Techo","Pintura","Demolición","Otros"
];

const UNIDADES = ["m²","m","unidad","hora","día","trabajo","otro"];

const CATALOGO_INICIAL = [
  { id:"c1", tipo:"Albañilería", descripcion:"Mampostería ladrillo cerámico del 12 en planta alta", unidad:"m²", precio:18000 },
  { id:"c2", tipo:"Aberturas", descripcion:"Ventana de aluminio, reja, celosía y contorno de material", unidad:"unidad", precio:250000 },
  { id:"c3", tipo:"Aberturas", descripcion:"Paño fijo", unidad:"unidad", precio:120000 },
  { id:"c4", tipo:"Aberturas", descripcion:"Ventiluz", unidad:"unidad", precio:45000 },
  { id:"c5", tipo:"Revoque grueso", descripcion:"Revoque exterior impermeabilizado y bolseado", unidad:"m²", precio:12000 },
  { id:"c6", tipo:"Revoque fino", descripcion:"Revoque interior", unidad:"m²", precio:9000 },
  { id:"c7", tipo:"Carpeta", descripcion:"Carpeta de nivelación para colocación de cerámico", unidad:"m²", precio:5000 },
  { id:"c8", tipo:"Piso cerámico", descripcion:"Piso cerámico con colocación de zócalo", unidad:"m²", precio:18000 },
  { id:"c9", tipo:"Piso cerámico", descripcion:"Revestimiento baño completo", unidad:"m²", precio:16000 },
  { id:"c10", tipo:"Contrapiso", descripcion:"Completar alivianado y alisar con cemento", unidad:"m²", precio:7000 },
  { id:"c11", tipo:"Demolición", descripcion:"Picar, cargar y sacar chapa", unidad:"m²", precio:4000 }
];

/* =====================================================================
   3. CLAVES DE ALMACENAMIENTO LOCAL
   ===================================================================== */
const LS = {
  config:"pa_config",
  tipos:"pa_tipos",
  catalogo:"pa_catalogo",
  presupuestos:"pa_presupuestos",
  borrador:"pa_borrador"
};

/* =====================================================================
   4. UTILIDADES
   ===================================================================== */
function guardar(clave, valor){
  try{ localStorage.setItem(clave, JSON.stringify(valor)); return true; }
  catch(e){ console.error("Error al guardar", e); return false; }
}
function leer(clave, porDefecto){
  try{
    const v = localStorage.getItem(clave);
    if(v===null) return porDefecto;
    return JSON.parse(v);
  }catch(e){ return porDefecto; }
}
function uid(){ return Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8); }

function formatARS(n){
  n = Number(n);
  if(!isFinite(n)) n = 0;
  return "$ " + n.toLocaleString("es-AR", { minimumFractionDigits:2, maximumFractionDigits:2 });
}
function numero(v){
  const n = parseFloat(v);
  return isFinite(n) ? n : 0;
}
function hoyDDMMYYYY(){
  const d = new Date();
  return pad2(d.getDate())+"/"+pad2(d.getMonth()+1)+"/"+d.getFullYear();
}
function pad2(n){ return n<10 ? "0"+n : ""+n; }
function escapeHtml(s){
  if(s===undefined||s===null) return "";
  return String(s).replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;" }[c]));
}

/* =====================================================================
   8. CÁLCULOS DEL PRESUPUESTO
   ===================================================================== */
function subtotalTrabajo(t){ return numero(t.cantidad) * numero(t.precio); }

function listaDeTrabajos(p){
  if(p.modo==="ambientes"){
    let todos = [];
    (p.ambientes||[]).forEach(a=>{ todos = todos.concat(a.trabajos||[]); });
    return todos;
  }
  return p.trabajos||[];
}

function calcularTotales(p){
  const trabajos = listaDeTrabajos(p);
  const subtotal = trabajos.reduce((acc,t)=>acc+subtotalTrabajo(t), 0);
  let montoRecargo = 0;
  if(p.recargo && numero(p.recargo.valor) > 0){
    montoRecargo = p.recargo.tipo==="porcentaje" ? subtotal * numero(p.recargo.valor)/100 : numero(p.recargo.valor);
  }
  let montoDescuento = 0;
  if(p.descuento && numero(p.descuento.valor) > 0){
    montoDescuento = p.descuento.tipo==="porcentaje" ? subtotal * numero(p.descuento.valor)/100 : numero(p.descuento.valor);
  }
  const total = subtotal + montoRecargo - montoDescuento;
  return { subtotal, montoRecargo, montoDescuento, total: total<0?0:total };
}

  if(tot.montoRecargo>0) html += '<div class="linea"><span>Recargo</span><b>'+formatARS(tot.montoRecargo)+'</b></div>';
  if(tot.montoDescuento>0) html += '<div class="linea"><span>Descuento</span><b>-'+formatARS(tot.montoDescuento)+'</b></div>';
  html += '<div class="linea-total"><span>TOTAL</span><b>'+formatARS(tot.total)+'</b></div>';
  html += '</div>';

  html += '<div style="display:flex; flex-direction:column; gap:10px; margin-top:22px;">';
  html += '<button class="btn btn-primario btn-bloque" id="btn-guardar-presupuesto">'+ICONOS.check+' Guardar presupuesto</button>';
  if(estado.editandoId){
    html += '<button class="btn btn-secundario btn-bloque" id="btn-imprimir-presupuesto">'+ICONOS.impresora+' Guardar como PDF</button>';
    html += '<button class="btn btn-secundario btn-bloque" id="btn-duplicar-presupuesto">'+ICONOS.copiar+' Duplicar presupuesto</button>';
    html += '<button class="btn btn-peligro btn-bloque" id="btn-eliminar-presupuesto">'+ICONOS.tacho+' Eliminar presupuesto</button>';
  }
  html += '</div>';

  return html;
}

function optSel(valor,label,actual){
  return '<option value="'+valor+'" '+(valor===actual?"selected":"")+'>'+label+'</option>';
}

function renderTrabajosSeccion(p){
  if(p.modo==="ambientes"){
    let html = "";
    (p.ambientes||[]).forEach((amb, idxAmb)=>{
      const sub = (amb.trabajos||[]).reduce((a,t)=>a+subtotalTrabajo(t),0);
      html += '<div class="ambiente-bloque">';
      html += '<div class="ambiente-cabecera"><h3>'+escapeHtml(amb.nombre||"Ambiente")+'</h3>'
        + '<div style="display:flex;gap:4px;">'
        + '<button class="btn-icono" data-editar-ambiente="'+idxAmb+'" aria-label="Renombrar">'+ICONOS.lapiz+'</button>'
        + '<button class="btn-icono" data-borrar-ambiente="'+idxAmb+'" aria-label="Eliminar ambiente">'+ICONOS.tacho+'</button>'
        + '</div></div>';
      html += renderListaTrabajos(amb.trabajos||[], idxAmb);
      if(!(amb.trabajos||[]).length){
        html += '<p style="color:var(--ink-soft);font-size:14px;padding:6px 2px;">Sin trabajos todavía.</p>';
      }
      html += '<div class="ambiente-subtotal">Subtotal: '+formatARS(sub)+'</div>';
      html += '<button class="btn btn-secundario btn-chico" data-agregar-a-ambiente="'+idxAmb+'">'+ICONOS.mas+' Agregar trabajo a este ambiente</button>';
      html += '</div>';
    });
    html += '<button class="btn btn-secundario btn-bloque" id="btn-nuevo-ambiente">'+ICONOS.mas+' Agregar ambiente</button>';
    return html;
  }else{
    let html = renderListaTrabajos(p.trabajos||[], null);
    if(!(p.trabajos||[]).length){
      html = '<div class="vacio">'+ICONOS.cajaVacia+'<p>Todavía no agregaste ningún trabajo.</p></div>';
    }
    return html;
  }
}

function renderListaTrabajos(trabajos, idxAmb){
  if(!trabajos.length) return "";
  const ambAttr = idxAmb===null||idxAmb===undefined ? "" : ' data-amb="'+idxAmb+'"';
  // Vista móvil (tarjetas)
  let movil = '<div class="lista-trabajos-movil">';
  trabajos.forEach((t,i)=>{
    movil += '<div class="trabajo-item">'
      + '<div class="top"><div><div class="tipo">'+escapeHtml(t.tipo)+'</div><div class="desc">'+escapeHtml(t.descripcion)+'</div></div>'
      + '<div class="acciones"><button class="btn-icono" data-editar-trabajo="'+i+'"'+ambAttr+' aria-label="Editar">'+ICONOS.lapiz+'</button>'
      + '<button class="btn-icono" data-borrar-trabajo="'+i+'"'+ambAttr+' aria-label="Eliminar">'+ICONOS.tacho+'</button></div></div>'
      + '<div class="calc">'+numero(t.cantidad)+' '+escapeHtml(t.unidad)+' x '+formatARS(t.precio)+'</div>'
      + '<div class="subtotal">'+formatARS(subtotalTrabajo(t))+'</div>'
      + '</div>';
  });
  movil += '</div>';
  // Vista de escritorio (tabla)
  let tabla = '<table class="tabla-trabajos"><thead><tr><th>Tipo</th><th>Descripción</th><th>Cant.</th><th>Unidad</th><th>Precio</th><th class="num">Subtotal</th><th></th></tr></thead><tbody>';
  trabajos.forEach((t,i)=>{
    tabla += '<tr><td>'+escapeHtml(t.tipo)+'</td><td>'+escapeHtml(t.descripcion)+'</td><td>'+numero(t.cantidad)+'</td><td>'+escapeHtml(t.unidad)+'</td>'
      + '<td class="num">'+formatARS(t.precio)+'</td><td class="num">'+formatARS(subtotalTrabajo(t))+'</td>'
      + '<td><div class="acciones-tabla"><button class="btn-icono" data-editar-trabajo="'+i+'"'+ambAttr+' aria-label="Editar">'+ICONOS.lapiz+'</button>'
      + '<button class="btn-icono" data-borrar-trabajo="'+i+'"'+ambAttr+' aria-label="Eliminar">'+ICONOS.tacho+'</button></div></td></tr>';
  });
  tabla += '</tbody></table>';
  return movil+tabla;
}

function abrirModalPrecio(id){
  const item = id ? DB.catalogo.find(x=>x.id===id) : { tipo:DB.tipos[0], descripcion:"", unidad:"m²", precio:0 };
  const opcionesTipos = DB.tipos.map(t=>'<option value="'+escapeHtml(t)+'" '+(t===item.tipo?"selected":"")+'>'+escapeHtml(t)+'</option>').join("");
  const opcionesUnidad = UNIDADES.map(u=>'<option value="'+u+'" '+(u===item.unidad?"selected":"")+'>'+u+'</option>').join("");
  const cuerpo = ''
    + '<div class="campo"><label>Tipo de trabajo</label><select id="mp-tipo">'+opcionesTipos+'</select>'
    + '<button type="button" class="btn-fantasax" id="mp-nuevo-tipo" style="margin-top:6px;color:var(--brick);background:none;border:none;font-weight:700;font-size:14px;padding:4px 0;">+ Agregar tipo nuevo</button></div>'
    + '<div class="campo"><label>Descripción del trabajo</label><input type="text" id="mp-descripcion" value="'+escapeHtml(item.descripcion)+'"></div>'
    + '<div class="fila-2">'
    + '<div class="campo"><label>Unidad</label><select id="mp-unidad">'+opcionesUnidad+'</select></div>'
    + '<div class="campo"><label>Precio</label><input type="number" min="0" step="0.01" id="mp-precio" value="'+item.precio+'"></div>'
    + '</div>';

  abrirModal({
    titulo: id ? "Editar trabajo" : "Nuevo trabajo del catálogo",
    cuerpoHtml: cuerpo,
    botones:[
      { texto:"Cancelar", clase:"btn-secundario" },
      { texto:"Guardar", clase:"btn-primario", accion:()=>{
        const tipo = document.getElementById("mp-tipo").value.trim();
        const descripcion = document.getElementById("mp-descripcion").value.trim();
        const unidad = document.getElementById("mp-unidad").value;
        const precio = numero(document.getElementById("mp-precio").value);
        if(!descripcion){ mostrarToast("Completá la descripción del trabajo."); return false; }
        if(precio<0){ mostrarToast("El precio no puede ser negativo."); return false; }
        if(id){
          const it = DB.catalogo.find(x=>x.id===id);
          it.tipo=tipo; it.descripcion=descripcion; it.unidad=unidad; it.precio=precio;
        }else{
          DB.catalogo.push({ id:uid(), tipo, descripcion, unidad, precio });
        }
        guardar(LS.catalogo, DB.catalogo);
        render();
        mostrarToast("Trabajo guardado.");
      } }
    ]
  });

  document.getElementById("mp-nuevo-tipo").addEventListener("click", ()=>{
    abrirModalTextoSimple("Nuevo tipo de trabajo","Nombre del tipo", "", (valor)=>{
      if(!valor.trim()) return;
      if(!DB.tipos.includes(valor.trim())) DB.tipos.push(valor.trim());
      guardar(LS.tipos, DB.tipos);
      abrirModalPrecio(id);
      setTimeout(()=>{ const s=document.getElementById("mp-tipo"); if(s) s.value=valor.trim(); },0);
    });
  });
}

function confirmarBorrarPrecio(id){
  abrirModal({

    cuerpoHtml:"<p>Esta acción no se puede deshacer. No afecta a los presupuestos ya guardados.</p>",
    botones:[

function adjuntarEventosConfig(){
  document.getElementById("btn-guardar-config").addEventListener("click", ()=>{
    DB.config.empresa = document.getElementById("cfg-empresa").value.trim();
    DB.config.telefono = document.getElementById("cfg-telefono").value.trim();
    DB.config.localidad = document.getElementById("cfg-localidad").value.trim();
    DB.config.condicionesDefault = document.getElementById("cfg-condiciones").value;

    render();

  });

  document.getElementById("btn-subir-logo").addEventListener("click", ()=> document.getElementById("input-logo").click());
  document.getElementById("input-logo").addEventListener("change", (e)=>{
    const f = e.target.files[0];
    if(!f) return;
    const lector = new FileReader();
    lector.onload = ()=>{
      DB.config.logo = lector.result;
      guardar(LS.config, DB.config);
      render();
      mostrarToast("Logo actualizado.");
    };
    lector.readAsDataURL(f);
  });
  const btnQuitar = document.getElementById("btn-quitar-logo");
  if(btnQuitar) btnQuitar.addEventListener("click", ()=>{
    DB.config.logo = null;
    guardar(LS.config, DB.config);
    render();
  });

  document.getElementById("btn-exportar").addEventListener("click", exportarBackup);
  document.getElementById("btn-importar").addEventListener("click", ()=> document.getElementById("input-backup").click());
  document.getElementById("input-backup").addEventListener("change", (e)=>{
    const f = e.target.files[0];
    if(!f) return;
    const lector = new FileReader();
    lector.onload = ()=>{
      let datos;
      try{ datos = JSON.parse(lector.result); }
      catch(err){ mostrarToast("El archivo no es un backup válido."); return; }
      confirmarImportarBackup(datos);
    };
    lector.readAsText(f);
    e.target.value = "";
  });
}

function exportarBackup(){
  const backup = {
    tipo:"backup-presupuestos-albanileria",
    version:1,
    fecha: new Date().toISOString(),
    config: DB.config,
    tipos: DB.tipos,
    catalogo: DB.catalogo,
    presupuestos: DB.presupuestos
  };
  const blob = new Blob([JSON.stringify(backup,null,2)], { type:"application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const fechaArchivo = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = "backup-presupuestos-"+fechaArchivo+".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  mostrarToast("Backup descargado.");
}

function confirmarImportarBackup(datos){
  abrirModal({
    titulo:"⚠️ Importar backup",
    cuerpoHtml:"<p>Importar este backup reemplazará los datos actuales (empresa, precios y presupuestos). ¿Querés continuar?</p>",
    botones:[
      { texto:"Cancelar", clase:"btn-secundario" },
      { texto:"Importar", clase:"btn-primario", accion:()=>{
        DB.config = datos.config || CONFIG_INICIAL;
        DB.tipos = datos.tipos && datos.tipos.length ? datos.tipos : TIPOS_TRABAJO_INICIALES.slice();
        DB.catalogo = datos.catalogo || [];
        DB.presupuestos = datos.presupuestos || [];
        persistirTodo();
        estado.pantalla = "inicio";
        render();
        mostrarToast("Backup importado correctamente.");
      } }
    ]
  });
}

  bindNumero("ed-mano-obra", v=>p.materialesConfig.manoObra=v);
  bindNumero("ed-materiales", v=>p.materialesConfig.materiales=v);

  const selDescT = document.getElementById("ed-descuento-tipo");

  bindNumero("ed-descuento-valor", v=>{ p.descuento.valor=v; render(); }, true);

    b.addEventListener("click", ()=>{
      const i = parseInt(b.getAttribute("data-editar-trabajo"),10);

  app.querySelectorAll("[data-borrar-trabajo]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const i = parseInt(b.getAttribute("data-borrar-trabajo"),10);
      const ambIdx = b.hasAttribute("data-amb") ? parseInt(b.getAttribute("data-amb"),10) : null;
      const arr = ambIdx===null ? p.trabajos : p.ambientes[ambIdx].trabajos;
      arr.splice(i,1);
      programarAutoguardado();
      render();
    });

  app.querySelectorAll("[data-agregar-a-ambiente]").forEach(b=>{
    b.addEventListener("click", ()=> abrirModalTrabajo(null, parseInt(b.getAttribute("data-agregar-a-ambiente"),10)));

      render();
    });
  });
  app.querySelectorAll("[data-editar-ambiente]").forEach(b=>{

      const idx = parseInt(b.getAttribute("data-editar-ambiente"),10);

        programarAutoguardado();

  app.querySelectorAll("[data-borrar-ambiente]").forEach(b=>{

        botones:[
          { texto:"Cancelar", clase:"btn-secundario" },
          { texto:"Eliminar", clase:"btn-peligro-lleno", accion:()=>{
            p.ambientes.splice(idx,1);
            programarAutoguardado();
            render();

        ]
      });

  document.getElementById("btn-guardar-presupuesto").addEventListener("click", guardarPresupuestoActual);

  if(btnEliminar) btnEliminar.addEventListener("click", ()=>{
    abrirModal({
      titulo:"¿Seguro que querés eliminar este presupuesto?",

          limpiarBorrador();

          render();
          mostrarToast("Presupuesto eliminado.");

    });

    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener("input", (e)=>{ setter(e.target.value); programarAutoguardado(); });
  }
  function bindNumero(id, setter, rerenderTotales){
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener("input", (e)=>{ setter(numero(e.target.value)); programarAutoguardado(); if(rerenderTotales) actualizarResumenSinPerderFoco(); });
  }
}

// Actualiza sólo los números del resumen sin perder el foco del input que se está tipeando

  const p = estado.presupuestoActual;
  const tot = calcularTotales(p);
  const resumen = app.querySelector(".resumen");
  if(!resumen) return;
  let html = '<div class="linea"><span>Subtotal</span><b>'+formatARS(tot.subtotal)+'</b></div>';

  if(tot.montoDescuento>0) html += '<div class="linea"><span>Descuento</span><b>-'+formatARS(tot.montoDescuento)+'</b></div>';

/* ---------- Modal: Agregar / Editar trabajo ---------- */
function abrirModalTrabajo(indice, ambIdx){
  const p = estado.presupuestoActual;
  const arr = ambIdx===null||ambIdx===undefined ? p.trabajos : p.ambientes[ambIdx].trabajos;
  const existente = (indice!==null && indice!==undefined) ? arr[indice] : null;

  const opcionesCatalogo = '<option value="">— Escribir manualmente —</option>' + DB.catalogo
    .slice().sort((a,b)=>a.descripcion.localeCompare(b.descripcion))
    .map(it=>'<option value="'+it.id+'">'+escapeHtml(it.descripcion)+'</option>').join("");
  const opcionesTipos = DB.tipos.map(t=>'<option value="'+escapeHtml(t)+'" '+(existente&&t===existente.tipo?"selected":"")+'>'+escapeHtml(t)+'</option>').join("");
  const opcionesUnidad = UNIDADES.map(u=>'<option value="'+u+'" '+(existente&&u===existente.unidad?"selected":"")+'>'+u+'</option>').join("");

  const cuerpo = ''
    + (DB.catalogo.length ? '<div class="campo"><label>Elegir del catálogo de precios</label><select id="mt-catalogo">'+opcionesCatalogo+'</select></div>' : '')
    + '<div class="campo"><label>Tipo de trabajo</label><select id="mt-tipo">'+opcionesTipos+'</select></div>'
    + '<div class="campo"><label>Descripción</label><input type="text" id="mt-descripcion" value="'+escapeHtml(existente?existente.descripcion:"")+'"></div>'
    + '<div class="fila-2 apilar-movil">'
    + '<div class="campo"><label>Cantidad</label><input type="number" min="0" step="0.01" id="mt-cantidad" value="'+(existente?existente.cantidad:1)+'"></div>'
    + '<div class="campo"><label>Unidad</label><select id="mt-unidad">'+opcionesUnidad+'</select></div>'
    + '</div>'
    + '<div class="campo"><label>Precio unitario</label><input type="number" min="0" step="0.01" id="mt-precio" value="'+(existente?existente.precio:0)+'"></div>'
    + '<div class="campo" style="margin-bottom:0;"><label>Subtotal</label><div id="mt-subtotal" style="font-size:20px;font-weight:700;color:var(--brick);padding:6px 0;">'+formatARS(existente?subtotalTrabajo(existente):0)+'</div></div>';

  abrirModal({
    titulo: existente ? "Editar trabajo" : "Agregar trabajo",
    cuerpoHtml: cuerpo,
    botones:[
      { texto:"Cancelar", clase:"btn-secundario" },
      { texto: existente ? "Guardar" : "Agregar", clase:"btn-primario", accion:()=>{
        const tipo = document.getElementById("mt-tipo").value;
        const descripcion = document.getElementById("mt-descripcion").value.trim();
        const cantidad = numero(document.getElementById("mt-cantidad").value);
        const unidad = document.getElementById("mt-unidad").value;
        const precio = numero(document.getElementById("mt-precio").value);
        if(!descripcion){ mostrarToast("Completá la descripción del trabajo."); return false; }
        if(cantidad<0){ mostrarToast("La cantidad no puede ser negativa."); return false; }
        if(precio<0){ mostrarToast("El precio no puede ser negativo."); return false; }
        const nuevo = { tipo, descripcion, cantidad, unidad, precio };
        if(existente){ arr[indice] = nuevo; } else { arr.push(nuevo); }
        programarAutoguardado();
        render();
      } }
    ]
  });

  function actualizarSubtotalModal(){
    const c = numero(document.getElementById("mt-cantidad").value);
    const pr = numero(document.getElementById("mt-precio").value);
    document.getElementById("mt-subtotal").textContent = formatARS(c*pr);
  }
  document.getElementById("mt-cantidad").addEventListener("input", actualizarSubtotalModal);
  document.getElementById("mt-precio").addEventListener("input", actualizarSubtotalModal);

  const selCatalogo = document.getElementById("mt-catalogo");
  if(selCatalogo){
    selCatalogo.addEventListener("change",(e)=>{
      const it = DB.catalogo.find(x=>x.id===e.target.value);
      if(!it) return;
      document.getElementById("mt-tipo").value = it.tipo;
      document.getElementById("mt-descripcion").value = it.descripcion;
      document.getElementById("mt-unidad").value = it.unidad;
      document.getElementById("mt-precio").value = it.precio;
      actualizarSubtotalModal();
    });
  }
}

/* =====================================================================
   12. VALIDACIÓN Y GUARDADO DEL PRESUPUESTO
   ===================================================================== */
function guardarPresupuestoActual(){
  const p = estado.presupuestoActual;
  if(!p.cliente.nombre || !p.cliente.nombre.trim()){
    mostrarToast("Completá el nombre del cliente.");
    return;
  }
  const trabajos = listaDeTrabajos(p);
  if(!trabajos.length){
    mostrarToast("Agregá al menos un trabajo antes de guardar.");
    return;
  }
  for(const t of trabajos){
    if(numero(t.cantidad) < 0 || numero(t.precio) < 0){
      mostrarToast("Hay cantidades o precios negativos. Revisá los trabajos.");
      return;
    }
  }
  const ahora = Date.now();
  if(estado.editandoId){
    const idx = DB.presupuestos.findIndex(x=>x.id===estado.editandoId);
    p.updatedAt = ahora;
    if(idx>=0) DB.presupuestos[idx] = p; else DB.presupuestos.push(p);
  }else{
    p.id = uid();
    p.createdAt = ahora;
    p.updatedAt = ahora;
    DB.presupuestos.push(p);
    estado.editandoId = p.id;
  }
  guardar(LS.presupuestos, DB.presupuestos);
  limpiarBorrador();
  mostrarToast("Presupuesto guardado.");
  estado.pantalla = "inicio";
  estado.presupuestoActual = null;
  render();
}

/* =====================================================================
   13. IMPRESIÓN / PDF
   ===================================================================== */
function imprimirPresupuesto(p){
  const tot = calcularTotales(p);
  const c = DB.config;
  let filasHtml = "";

  function filaTrabajo(t){
    return '<tr><td>'+escapeHtml(t.tipo)+'</td><td>'+escapeHtml(t.descripcion)+'</td>'
      + '<td class="num">'+numero(t.cantidad)+'</td><td class="num">'+escapeHtml(t.unidad)+'</td>'
      + '<td class="num">'+formatARS(t.precio)+'</td><td class="num">'+formatARS(subtotalTrabajo(t))+'</td></tr>';
  }

  if(p.modo==="ambientes"){
    (p.ambientes||[]).forEach(amb=>{
      filasHtml += '<tr><td colspan="6" class="ph-ambiente-titulo">'+escapeHtml(amb.nombre)+'</td></tr>';
      (amb.trabajos||[]).forEach(t=> filasHtml += filaTrabajo(t));
    });
  }else{
    (p.trabajos||[]).forEach(t=> filasHtml += filaTrabajo(t));
  }

  let notaMateriales = "";
  const etiquetasMat = { incluidos:"Materiales incluidos", no_incluidos:"Materiales no incluidos", cliente:"Materiales a cargo del cliente" };
  notaMateriales = '<div class="ph-nota">'+ (etiquetasMat[p.materialesConfig.modo]||"") +'</div>';
  if(p.materialesConfig.separar){
    notaMateriales += '<div class="ph-nota">Mano de obra: '+formatARS(p.materialesConfig.manoObra)+' · Materiales: '+formatARS(p.materialesConfig.materiales)+'</div>';
  }

  const logoHtml = c.logo ? '<img class="ph-logo" src="'+c.logo+'">' : '';

  const html = ''
    + '<div class="hoja">'
    + '<div class="ph-header">'+logoHtml
    + '<div><div class="ph-empresa">'+escapeHtml(c.empresa||"")+'</div>'
    + '<div class="ph-contacto">'+[c.telefono, c.localidad].filter(Boolean).map(escapeHtml).join(" · ")+'</div></div>'
    + '<div class="ph-titulo">Presupuesto</div>'
    + '</div>'
    + '<div class="ph-datos-cliente">'
    + '<div><b>Cliente</b>'+escapeHtml(p.cliente.nombre)+'</div>'
    + '<div><b>Teléfono</b>'+escapeHtml(p.cliente.telefono||"-")+'</div>'
    + '<div><b>Dirección</b>'+escapeHtml(p.cliente.direccion||"-")+'</div>'
    + '<div><b>Fecha</b>'+escapeHtml(p.fecha)+'</div>'
    + '</div>'
    + '<table class="ph-tabla"><thead><tr><th>Tipo</th><th>Descripción</th><th class="num">Cant.</th><th class="num">Unidad</th><th class="num">Precio</th><th class="num">Total</th></tr></thead><tbody>'+filasHtml+'</tbody></table>'
    + notaMateriales
    + '<div class="ph-resumen">'
    + '<div class="linea"><span>Subtotal</span><span>'+formatARS(tot.subtotal)+'</span></div>'
    + (tot.montoRecargo>0 ? '<div class="linea"><span>Recargo</span><span>'+formatARS(tot.montoRecargo)+'</span></div>' : '')
    + (tot.montoDescuento>0 ? '<div class="linea"><span>Descuento</span><span>-'+formatARS(tot.montoDescuento)+'</span></div>' : '')
    + '<div class="total"><span>TOTAL</span><span>'+formatARS(tot.total)+'</span></div>'
    + '</div>'
    + (p.condiciones ? '<div class="ph-condiciones">'+escapeHtml(p.condiciones)+'</div>' : '')
    + '</div>';

  document.getElementById("print-area").innerHTML = html;
  window.print();
}

/* =====================================================================
   14. MODAL GENÉRICO Y TOAST
   ===================================================================== */
function abrirModal({titulo, cuerpoHtml, botones}){
  const raiz = document.getElementById("modal-root");
  let botonesHtml = botones.map((b,i)=> '<button class="btn '+b.clase+'" data-modal-btn="'+i+'">'+escapeHtml(b.texto)+'</button>').join("");
  raiz.innerHTML = '<div class="overlay" id="modal-overlay"><div class="modal">'
    + '<h3>'+escapeHtml(titulo)+'</h3>'
    + '<div class="modal-cuerpo">'+cuerpoHtml+'</div>'
    + '<div class="modal-botones">'+botonesHtml+'</div>'
    + '</div></div>';

  const overlay = document.getElementById("modal-overlay");
  overlay.addEventListener("click",(e)=>{ if(e.target===overlay) cerrarModal(); });
  botones.forEach((b,i)=>{
    document.querySelector('[data-modal-btn="'+i+'"]').addEventListener("click", ()=>{
      if(b.accion){
        const resultado = b.accion();
        if(resultado===false) return;
      }
      cerrarModal();
    });
  });
}
function cerrarModal(){
  document.getElementById("modal-root").innerHTML = "";
}
function abrirModalTextoSimple(titulo,label,valorInicial,onGuardar){
  abrirModal({
    titulo,
    cuerpoHtml:'<div class="campo"><label>'+escapeHtml(label)+'</label><input type="text" id="mts-input" value="'+escapeHtml(valorInicial||"")+'"></div>',
    botones:[
      { texto:"Cancelar", clase:"btn-secundario" },
      { texto:"Guardar", clase:"btn-primario", accion:()=>{
        const v = document.getElementById("mts-input").value;
        onGuardar(v);
      } }
    ]
  });
  setTimeout(()=>{ const i=document.getElementById("mts-input"); if(i){ i.focus(); i.select(); } }, 30);
}

let toastTimer=null;
function mostrarToast(msg){
  const raiz = document.getElementById("toast-root");
  raiz.innerHTML = '<div class="toast">'+ICONOS.check+' '+escapeHtml(msg)+'</div>';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ raiz.innerHTML=""; }, 2600);
}

/* =====================================================================
   15. RECUPERACIÓN DE BORRADOR AL INICIAR
   ===================================================================== */
function revisarBorradorAlIniciar(){
  const b = leer(LS.borrador, null);
  if(!b || !b.datos) return;
  abrirModal({
    titulo:"Presupuesto sin terminar",
    cuerpoHtml:"<p>Tenés un presupuesto sin terminar. ¿Querés recuperarlo?</p>",
    botones:[
      { texto:"Descartar", clase:"btn-secundario", accion:()=>{ limpiarBorrador(); } },
      { texto:"Recuperar", clase:"btn-primario", accion:()=>{
        estado.presupuestoActual = b.datos;
        estado.editandoId = b.editandoId;
        estado.pantalla = "editor";
        render();
      } }
    ]
  });
}

/* =====================================================================
   16. INICIO DE LA APLICACIÓN
   ===================================================================== */
render();
revisarBorradorAlIniciar();

})();
